name: Build Pear Desktop

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: write # REQUIRED to create releases

env:
  NODE_VERSION: "22.x"

jobs:
  build:
    name: Build Pear Desktop
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Code (Vite)
        run: pnpm build

      - name: Build Windows Exe on Linux
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine32 wine64
          npx electron-builder --win --x64
        env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- THIS CREATES A RELEASE ---
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          draft: false
          prerelease: true
          # This overwrites the previous 'nightly' release so you always have the latest
          make_latest: true 
          files: pack/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
