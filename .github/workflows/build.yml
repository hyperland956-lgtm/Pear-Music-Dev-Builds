name: Build All Platforms

on:
  push:
    branches: [ master, main ]
  pull_request:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- WINDOWS JOB ---
          - os: windows-latest
            platform: Windows
            # Builds .exe
            build_cmd: npx electron-builder --win --x64
            # Uploads the Installer
            file_pattern: "pack/*.exe"

          # --- MACOS JOB ---
          - os: macos-latest
            platform: macOS
            # Builds .dmg and .zip
            build_cmd: npx electron-builder --mac --x64
            # Uploads DMG and ZIP
            file_pattern: "pack/*.dmg pack/*.zip"

          # --- LINUX JOB ---
          - os: ubuntu-latest
            platform: Linux
            # Builds AppImage and Deb (add 'rpm' or 'snap' here if you want them)
            build_cmd: npx electron-builder --linux --x64 deb appimage
            # Uploads AppImage and Deb
            file_pattern: "pack/*.AppImage pack/*.deb"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compile the source code (Vite)
      - name: Compile Code
        run: pnpm build

      # Package the app using the command defined in the matrix above
      - name: Build Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_cmd }}

      # Upload artifacts to the 'nightly' release
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' # Only upload if we pushed code, not on PRs
        with:
          tag_name: nightly
          name: Nightly Build
          draft: false
          prerelease: true
          files: ${{ matrix.file_pattern }}
          # This ensures that multiple jobs can update the release simultaneously
          make_latest: true
