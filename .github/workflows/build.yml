name: Build Pear Desktop

on:
  push:
    branches: [ master, main ]
  pull_request:

env:
  NODE_VERSION: "22.x"

jobs:
  build:
    name: Build Pear Desktop
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- 1. COMPILE SOURCE CODE ---
      - name: Compile Code (Vite)
        run: pnpm build

      # --- 2. BUILD FOR WINDOWS (ON LINUX) ---
      - name: Build Windows Exe on Linux
        run: |
          # Install Wine (required for Windows builds on Linux)
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine32 wine64

          # Build the Windows binary
          npx electron-builder --win --x64
        env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- DEBUG STEP (In case it fails again, check logs here) ---
      - name: List all generated files
        run: find . -name "*.exe"

      # --- 3. UPLOAD ARTIFACTS ---
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-windows
          # The double star ** finds the file in ANY subfolder (dist, release, out, etc.)
          path: "**/*.exe"
