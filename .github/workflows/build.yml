name: Build Pear Desktop

on:
  push:
    branches: [ master, main ]
  pull_request:

env:
  NODE_VERSION: "22.x"

jobs:
  build:
    name: Build Pear Desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Changed to false so if Mac fails, Windows keeps trying
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    steps:
      # --- FIX FOR WINDOWS ASSETS (ENOENT ERROR) ---
      - name: Configure Git (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- UNIFIED BUILD STEP ---
      # This runs the standard build on all OSs to ensure code validity.
      # We removed the "if: github.repository..." check so it runs on your fork.
      - name: Run Build
        run: pnpm build

      # --- RELEASE STEPS (OPTIONAL FOR FORKS) ---
      # These might fail if you don't have the signing secrets (GH_TOKEN/Certificates).
      # I have enabled them to attempt a build, but if they fail on signing, 
      # at least the 'Run Build' step above confirms the code works.

      - name: Package Mac (Dry Run)
        if: startsWith(matrix.os, 'macOS')
        run: pnpm electron-vite build 

      - name: Package Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo snap install snapcraft --classic
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          # We run the build command instead of release to avoid signing errors on forks
          pnpm build

      - name: Package Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          # We run the build command explicitly. 
          # If you want to create the .exe installer, you usually need signing keys.
          # 'pnpm build' verifies the assets exist and code compiles.
          pnpm build
