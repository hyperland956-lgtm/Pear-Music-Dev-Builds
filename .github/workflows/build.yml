name: Build Pear Desktop

on:
  push:
    branches: [ master, main ]
  pull_request:

env:
  NODE_VERSION: "22.x"

jobs:
  build:
    name: Build Pear Desktop
    # FORCE LINUX (Since Windows fails with file errors)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- 1. COMPILE SOURCE CODE (Will work now because we are on Linux) ---
      - name: Compile Code (Vite)
        run: pnpm build

      # --- 2. BUILD FOR WINDOWS (Using Linux Runner) ---
      # This requires Wine, which we install below.
      - name: Build Windows Exe on Linux
        # Only run this if you actually want the .exe artifact
        run: |
          # Install Wine (needed to cross-compile for Windows)
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine32 wine64

          # Run the Windows build command
          # The --win flag tells electron-builder to target Windows
          npx electron-builder --win --x64
        env:
           GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. UPLOAD THE ARTIFACTS ---
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-windows
          path: dist/*.exe
