name: Dev Builds

# Triggers: Runs when you sync the fork (push to main) or manually click Run
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      # 1. Configure Git settings BEFORE checking out code
      - name: Configure Git (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true

      # 2. Checkout Code (Now it will respect the settings above)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Setup Node.js v22 (Same as your notebook)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Install PNPM
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10

      # 3. Get Date and Short Hash (For Naming)
      - name: Generate Build Name
        id: vars
        shell: bash
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 4. Install Dependencies
      - name: Install Dependencies
        run: pnpm install

      # 5. Build the Source Code (Bake the cake)
        # We skip type checking to speed it up for dev builds
      - name: Compile Source
        run: pnpm build

      # 6. Package the App (Box the cake)
      - name: Package Application
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npx electron-builder --win --x64 --publish never
          elif [ "$RUNNER_OS" == "Linux" ]; then
            npx electron-builder --linux appimage --x64 --publish never
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npx electron-builder --mac --x64 --publish never
          fi
        shell: bash

      # 7. Upload to Releases
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') != true # Run on normal pushes
        with:
          name: "Dev Build ${{ steps.vars.outputs.date }}" # Title: Dev Build 2025-12-06
          tag_name: "build-${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.sha_short }}" # Tag: build-2025-12-06-a1b2c
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
